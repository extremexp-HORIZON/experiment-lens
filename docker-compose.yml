version: "3.8"

services:
  xai-service:
    build:
      context: ./repos/extremexp-explainability-module
      dockerfile: Dockerfile
    container_name: xai-service
    ports:
      - "50051:50051"
    volumes:
      - ./repos/extremexp-explainability-module:/app
      - ${OUTPUT_DATA_PATH}:/app/output
      - ${EXPERIMENT_DATA_PATH}:/data/xtreme/experiments
      - ${MLFLOW_ARTIFACTS_PATH}:/opt/data/xtreme/mlflow/mlartifacts
    working_dir: /app
    command: python xai_server.py
    networks:
      - extremexp_network

  vis-api:
    build:
      context: ./repos/vis-api
      dockerfile: Dockerfile
    container_name: vis-api
    ports:
      - "8080:8080"
    volumes:
      - ./repos/vis-api/.env:/app/.env
      - ${OUTPUT_DATA_PATH}:/app/output
      - ${MLFLOW_ARTIFACTS_PATH}:/opt/data/xtreme/mlflow/mlartifacts
    restart: unless-stopped
    networks:
      - extremexp_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_GRPC_HOST_NAME: xai-service
      APP_GRPC_HOST_PORT: 50051
      MLFLOW_TRACKING_URL: http://host.docker.internal:5000
      KUBEFLOW_PIPELINES_BASE_URL: http://host.docker.internal:8888


  visualization-dashboard:
    build:
      context: ./repos/vis-frontend
      dockerfile: ./Dockerfile
    container_name: visualization-dashboard
    ports:
      - "5173:80"
    volumes:
      - ./custom-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vis-api
    networks:
      - extremexp_network
networks:
  extremexp_network:
    driver: bridge
